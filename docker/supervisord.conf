[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/drift-llm-supervisord.pid
childlogdir=/var/log/supervisor

[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres
priority=10
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:drift-chart-server]
directory=/opt/drift_llm_intepretation/drift 보고서
command=/bin/bash -lc 'until pg_isready -h 127.0.0.1 -p 5432 -U postgres -d drift_monitoring; do sleep 1; done; exec python3 charts/chart_selector_server.py'
priority=20
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=DRIFT_CHART_SELECTOR_HOST="0.0.0.0",DRIFT_CHART_SELECTOR_PORT="8765",DRIFT_DB_HOST="127.0.0.1",DRIFT_DB_PORT="5432",DRIFT_DB_NAME="drift_monitoring",DRIFT_DB_USER="postgres",DRIFT_DB_PASSWORD="%(ENV_POSTGRES_PASSWORD)s"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:llm-interpretation-server]
directory=/opt/drift_llm_intepretation/llm_interpretation_server
command=/bin/bash -lc 'until pg_isready -h 127.0.0.1 -p 5432 -U postgres -d drift_monitoring; do sleep 1; done; exec python3 interpretation_server.py'
priority=20
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=LLM_INTERPRETATION_SERVER_HOST="0.0.0.0",LLM_INTERPRETATION_SERVER_PORT="8767",LLM_API_ENDPOINT="%(ENV_LLM_API_ENDPOINT)s",LLM_MODEL="%(ENV_LLM_MODEL)s",LLM_TIMEOUT_SECONDS="90",LLM_RETRY_COUNT="1",DRIFT_DB_HOST="127.0.0.1",DRIFT_DB_PORT="5432",DRIFT_DB_NAME="drift_monitoring",DRIFT_DB_USER="postgres",DRIFT_DB_PASSWORD="%(ENV_POSTGRES_PASSWORD)s"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:drift-server]
directory=/opt/drift_llm_intepretation/drift_control_plane
command=python3 -m uvicorn drift_server.app.main:app --host 127.0.0.1 --port 8771
priority=30
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:test-feeder-server]
directory=/opt/drift_llm_intepretation/drift_control_plane
command=python3 -m uvicorn test_feeder_server.app.main:app --host 127.0.0.1 --port 8772
priority=30
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:chart-builder-server]
directory=/opt/drift_llm_intepretation/chart_builder
command=python3 -m uvicorn chart_builder_server:app --host 0.0.0.0 --port 8766
priority=30
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:admin-server]
directory=/opt/drift_llm_intepretation/drift_control_plane
command=python3 -m uvicorn admin_server.app.main:app --host 0.0.0.0 --port 8770
priority=40
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
